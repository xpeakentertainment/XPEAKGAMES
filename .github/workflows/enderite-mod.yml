name: Enderite Mod CI

on:
  push:
    branches: [ enderite-mod ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enderite-mod-ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Prepare output
        run: mkdir -p out/logs out/screenshots out/api

      - name: Build mod
        id: build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee out/logs/build.log

      - name: API info
        if: always() && hashFiles('ci/classes.txt') != ''
        continue-on-error: true
        run: bash ci/apiinfo.sh out/api

      - name: Server self-test
        if: steps.build.outcome == 'success' && hashFiles('ci/run-tests') != ''
        continue-on-error: true
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-seed=enderite\nspawn-protection=0\nview-distance=6\nsimulation-distance=6\nlevel-name=world\n" > run/server.properties
          set -o pipefail
          ENDERITE_SELFTEST=1 timeout 1500 gradle runServer --no-daemon 2>&1 | tee out/logs/server.log || true
          cp run/logs/latest.log out/logs/server-latest.log || true
          cp run/enderite-selftest.txt out/ || true

      - name: Client test (Xvfb)
        if: steps.build.outcome == 'success' && hashFiles('ci/run-tests') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          mkdir -p run/saves
          rm -rf run/saves/testworld
          if [ -d run/world ]; then cp -r run/world run/saves/testworld; rm -f run/saves/testworld/session.lock; fi
          printf "lang:es_es\nrenderDistance:6\nsimulationDistance:6\nmaxFps:30\nonboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\npauseOnLostFocus:false\nsoundCategory_master:0.0\nguiScale:2\n" > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          set -o pipefail
          ENDERITE_CLIENTTEST=1 timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon 2>&1 | tee out/logs/client.log || true
          cp run/logs/latest.log out/logs/client-latest.log || true
          cp run/screenshots/*.png out/screenshots/ || true
          cp run/enderite-clienttest.txt out/ || true
          cp run/crash-reports/*.txt out/logs/ || true

      - name: Collect jar
        if: always()
        run: |
          cp build/libs/*.jar out/ || true
          ls -la out out/*

      - name: Publish results
        if: always()
        run: |
          cd out
          echo "source=${GITHUB_SHA} run=${GITHUB_RUN_NUMBER} build=${{ steps.build.outcome }}" > RESULT.txt
          git init -q -b enderite-mod-results
          git add -A
          git -c user.name="enderite-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "CI results for ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" enderite-mod-results
